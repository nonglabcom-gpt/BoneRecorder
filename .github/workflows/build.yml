name: Build Bones REC 2.2.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          mkdir -p "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check source ZIP
        shell: bash
        run: |
          set -e

          ZIP="Bones_REC_2.2.1_Optimized_Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          unzip -t "$ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e

          unzip -q Bones_REC_2.2.1_Optimized_Source.zip -d source

          test -f source/BoneRecorder/app/build.gradle
          test -f source/BoneRecorder/settings.gradle

      - name: Build APK
        run: |
          cd source/BoneRecorder
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="source/BoneRecorder/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bones-REC-2.2.1-Optimized
          path: source/BoneRecorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
